name: Windows checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TARGET_DIR: target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -j 2 -- -D warnings
      - run: cargo test --locked -j 2
      - name: Test release publication using fake GitHub responses
        run: node --test tests/publish-release.test.cjs
      - name: Package without launching or collecting live data
        shell: pwsh
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: SleepDiagnostics-windows
          path: dist/
  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'release: publish v0.1.0'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: SleepDiagnostics-windows
          path: dist/
      - name: Publish the verified initial release
        uses: actions/github-script@v9
        with:
          script: |
            const { publish } = require('./scripts/publish-release.cjs');
            await publish({ github, context, core });
