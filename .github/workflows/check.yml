name: Windows checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TARGET_DIR: target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -j 2 -- -D warnings
      - run: cargo test --locked -j 2
      - name: Package without launching or collecting live data
        shell: pwsh
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: SleepDiagnostics-windows
          path: dist/
