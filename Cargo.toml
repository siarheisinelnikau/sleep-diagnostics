[package]
name = "sleep-diagnostics"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Read-only Windows sleep and wake evidence explorer"
repository = "https://github.com/siarheisinelnikau/sleep-diagnostics"
build = "build.rs"

[dependencies]
anyhow = "1.0.103"
getrandom = "0.2.17"
chrono = { version = "0.4.45", features = ["serde"] }
quick-xml = "0.41.0"
semver = "1.0.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
ureq = { version = "3.5.0", default-features = false, features = ["rustls", "json"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_EventLog",
  "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Power",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs",
  "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_Storage_FileSystem", "Win32_Security"
] }

[build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "abort"

[profile.dev]
incremental = false

[profile.test]
incremental = false

[lints.clippy]
undocumented_unsafe_blocks = "warn"
